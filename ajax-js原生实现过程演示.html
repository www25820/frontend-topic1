<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJAX 实现流程 · 交互动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0d1326 0%, #162040 50%, #0d1326 100%);
    min-height: 100vh;
    color: #fff;
    padding: 18px 24px;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    margin-bottom: 16px;
  }

  .title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 12px;
    color: #7c8db5;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* 主流程五步骤 */
  .flow-container {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    margin-bottom: 14px;
    gap: 0;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 2;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
    cursor: pointer;
  }

  .step-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .step-icon svg {
    width: 26px;
    height: 26px;
    fill: #5a6a8a;
    transition: all 0.5s ease;
  }

  .step-number {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #2a3550;
    color: #7c8db5;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.5s ease;
  }

  .step-label {
    font-size: 12px;
    color: #5a6a8a;
    font-weight: 500;
    text-align: center;
    transition: all 0.5s ease;
    line-height: 1.3;
    max-width: 100px;
  }

  .step.active .step-icon {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border-color: #60a5fa;
    box-shadow: 0 0 24px rgba(37, 99, 235, 0.5);
    transform: scale(1.1);
  }

  .step.active .step-icon svg { fill: #fff; }
  .step.active .step-number { background: #2563eb; color: #fff; }
  .step.active .step-label { color: #fff; font-weight: 600; }

  .step.done .step-icon {
    background: rgba(34, 197, 94, 0.12);
    border-color: rgba(34, 197, 94, 0.35);
  }
  .step.done .step-icon svg { fill: #4ade80; }
  .step.done .step-number { background: #166534; color: #4ade80; }
  .step.done .step-label { color: #86efac; }

  .connector {
    width: 50px;
    height: 2px;
    background: rgba(255,255,255,0.06);
    position: relative;
    flex-shrink: 0;
    margin-top: 27px;
    border-radius: 2px;
    overflow: hidden;
  }

  .connector::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, #60a5fa, transparent);
  }

  .connector.flowing::after { animation: flowLine 0.7s ease-in-out forwards; }
  .connector.done { background: rgba(34, 197, 94, 0.3); }

  @keyframes flowLine {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  /* 主展示区 */
  .main-stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
    height: 340px;
  }

  /* 左侧：可视化场景 */
  .visual-panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .panel-title {
    font-size: 12px;
    color: #7c8db5;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title::before {
    content: '';
    width: 3px;
    height: 14px;
    background: linear-gradient(180deg, #60a5fa, #a78bfa);
    border-radius: 2px;
  }

  .visual-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 浏览器窗口模拟 */
  .browser-mock {
    width: 90%;
    background: #1a2340;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: all 0.5s ease;
  }

  .browser-bar {
    background: rgba(255,255,255,0.05);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .browser-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }
  .browser-dot.r { background: #ff5f57; }
  .browser-dot.y { background: #febc2e; }
  .browser-dot.g { background: #28c840; }

  .browser-url {
    flex: 1;
    background: rgba(0,0,0,0.2);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 10px;
    color: #7c8db5;
    margin-left: 8px;
    font-family: monospace;
  }

  .browser-body {
    padding: 16px;
    min-height: 140px;
  }

  .mock-title {
    font-size: 14px;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 12px;
  }

  .mock-btn {
    display: inline-block;
    padding: 8px 18px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 12px;
  }

  .mock-btn.clicked {
    transform: scale(0.95);
    box-shadow: 0 0 20px rgba(37,99,235,0.6);
  }

  .mock-result {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 10px;
    font-size: 11px;
    color: #94a3b8;
    min-height: 50px;
    transition: all 0.5s ease;
  }

  .mock-result.loading {
    color: #fbbf24;
    font-style: italic;
  }

  .mock-result.error {
    color: #f87171;
    border-color: rgba(248,113,113,0.3);
  }

  .mock-result.success {
    color: #4ade80;
    border-color: rgba(74,222,128,0.3);
  }

  .user-row {
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 11px;
    color: #cbd5e1;
    opacity: 0;
    transform: translateX(-10px);
    animation: rowIn 0.4s ease forwards;
  }

  @keyframes rowIn {
    to { opacity: 1; transform: translateX(0); }
  }

  /* 服务器与请求动画 */
  .server-scene {
    display: flex;
    align-items: center;
    justify-content: space-around;
    width: 100%;
    padding: 0 20px;
  }

  .entity {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .entity-icon {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.5s ease;
  }

  .entity-icon svg {
    width: 32px;
    height: 32px;
  }

  .entity-browser {
    background: rgba(37,99,235,0.15);
    border: 2px solid rgba(37,99,235,0.4);
  }
  .entity-browser svg { fill: #60a5fa; }

  .entity-server {
    background: rgba(167,139,250,0.15);
    border: 2px solid rgba(167,139,250,0.4);
  }
  .entity-server svg { fill: #a78bfa; }

  .entity-label {
    font-size: 11px;
    color: #94a3b8;
    font-weight: 600;
  }

  .request-line {
    flex: 1;
    height: 2px;
    background: rgba(255,255,255,0.1);
    position: relative;
    margin: 0 10px;
  }

  .data-packet {
    position: absolute;
    top: -8px;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    opacity: 0;
  }

  .packet-req {
    background: rgba(37,99,235,0.8);
    color: #fff;
    animation: packetGo 1.2s ease-in-out forwards;
  }

  .packet-res {
    background: rgba(167,139,250,0.8);
    color: #fff;
    animation: packetBack 1.2s ease-in-out 0.6s forwards;
  }

  @keyframes packetGo {
    0% { left: 0; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { left: calc(100% - 18px); opacity: 0; }
  }

  @keyframes packetBack {
    0% { left: calc(100% - 18px); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { left: 0; opacity: 0; }
  }

  .server-status {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #7c8db5;
    background: rgba(0,0,0,0.2);
    padding: 4px 12px;
    border-radius: 10px;
  }

  /* JSON 解析可视化 */
  .json-scene {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
  }

  .json-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 12px;
    font-family: monospace;
    font-size: 10px;
    line-height: 1.6;
    transition: all 0.5s ease;
    max-width: 180px;
  }

  .json-raw {
    color: #fbbf24;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .json-parsed {
    color: #4ade80;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.6s ease;
  }

  .json-parsed.show {
    opacity: 1;
    transform: scale(1);
  }

  .json-arrow {
    font-size: 24px;
    color: #60a5fa;
    animation: arrowPulse 1s ease-in-out infinite;
  }

  @keyframes arrowPulse {
    0%, 100% { transform: translateX(0); opacity: 0.5; }
    50% { transform: translateX(6px); opacity: 1; }
  }

  .json-key { color: #93c5fd; }
  .json-string { color: #86efac; }
  .json-number { color: #fcd34d; }

  /* DOM 渲染可视化 */
  .dom-scene {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
  }

  .dom-step-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 90%;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s ease;
  }

  .dom-step-row.show {
    opacity: 1;
    transform: translateY(0);
  }

  .dom-step-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(37,99,235,0.2);
    border: 1px solid rgba(37,99,235,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #60a5fa;
    flex-shrink: 0;
  }

  .dom-step-text {
    font-size: 11px;
    color: #cbd5e1;
    flex: 1;
  }

  .dom-step-code {
    font-family: monospace;
    font-size: 10px;
    color: #fbbf24;
    background: rgba(0,0,0,0.2);
    padding: 3px 8px;
    border-radius: 4px;
  }

  /* 初始化代码展示 */
  .init-scene {
    width: 90%;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .init-line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 11px;
    opacity: 0.3;
    transition: all 0.4s ease;
    background: rgba(255,255,255,0.02);
  }

  .init-line.highlight {
    opacity: 1;
    background: rgba(37,99,235,0.15);
    border-left: 3px solid #60a5fa;
    transform: translateX(4px);
  }

  .init-line .line-num {
    color: #4a5568;
    font-size: 10px;
    min-width: 16px;
  }

  .init-line .line-code { color: #cbd5e1; }
  .init-line .kw { color: #c084fc; }
  .init-line .fn { color: #60a5fa; }
  .init-line .str { color: #86efac; }
  .init-line .cm { color: #4a5568; }

  /* 右侧：代码面板 */
  .code-panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .code-content {
    flex: 1;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 14px;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 11.5px;
    line-height: 1.7;
    overflow-y: auto;
    color: #cbd5e1;
  }

  .code-content::-webkit-scrollbar { width: 4px; }
  .code-content::-webkit-scrollbar-track { background: transparent; }
  .code-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .code-line {
    display: flex;
    gap: 10px;
    padding: 1px 4px;
    border-radius: 3px;
    transition: all 0.3s ease;
  }

  .code-line.active {
    background: rgba(37,99,235,0.2);
    box-shadow: inset 3px 0 0 #60a5fa;
  }

  .code-line .ln {
    color: #4a5568;
    min-width: 20px;
    text-align: right;
    user-select: none;
  }

  .code-line .lc { white-space: pre; }

  .kw { color: #c084fc; }
  .fn { color: #60a5fa; }
  .str { color: #86efac; }
  .num { color: #fcd34d; }
  .cm { color: #4a5568; font-style: italic; }
  .op { color: #f472b6; }
  .prop { color: #fbbf24; }

  /* 步骤说明 */
  .step-desc {
    text-align: center;
    margin-bottom: 12px;
    min-height: 42px;
  }

  .desc-title {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s ease;
  }

  .desc-title.show { opacity: 1; transform: translateY(0); }

  .desc-text {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 3px;
    opacity: 0;
    transform: translateY(8px);
    transition: all 0.4s ease 0.1s;
  }

  .desc-text.show { opacity: 1; transform: translateY(0); }

  /* 控制区 */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }

  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
  }

  .btn-primary {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    color: #fff;
    box-shadow: 0 4px 16px rgba(37,99,235,0.35);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(37,99,235,0.45);
  }

  .btn-secondary {
    background: rgba(255,255,255,0.06);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.1);
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }

  .btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none !important;
  }

  .btn svg { width: 14px; height: 14px; fill: currentColor; }

  /* 进度点 */
  .progress-dots {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    transition: all 0.4s ease;
    cursor: pointer;
  }

  .dot.active {
    background: #60a5fa;
    box-shadow: 0 0 10px rgba(96,165,250,0.6);
    transform: scale(1.3);
  }

  .dot.done { background: #4ade80; }

  /* 图标动画 */
  .step.active .icon-spin { animation: spin 2s linear infinite; }
  .step.active .icon-pulse { animation: pulse 1s ease-in-out infinite; }
  .step.active .icon-bounce { animation: bounce 0.8s ease-in-out infinite; }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .entity-icon.pulse { animation: pulse 1s ease-in-out infinite; }
  .entity-browser.pulse { box-shadow: 0 0 20px rgba(37,99,235,0.4); }
  .entity-server.pulse { box-shadow: 0 0 20px rgba(167,139,250,0.4); }
</style>
</head>
<body>

<div class="header">
  <h1 class="title">AJAX 原生 JS 实现流程</h1>
  <p class="subtitle">交互式动画演示 · 点击步骤或播放按钮查看详细过程</p>
</div>

<!-- 五步骤主流程 -->
<div class="flow-container" id="flowContainer">
  <div class="step" data-step="0">
    <div class="step-icon">
      <svg viewBox="0 0 24 24" class="icon-spin"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      <span class="step-number">1</span>
    </div>
    <div class="step-label">页面加载初始化</div>
  </div>
  <div class="connector" data-connector="0"></div>

  <div class="step" data-step="1">
    <div class="step-icon">

// 修复：统一管理子动画定时器，切步骤/重置时全部清理，避免残留定时器导致动画错乱
function schedule(fn, ms) {
  subTimers.push(setTimeout(fn, ms));
}
function clearSubTimers() {
  subTimers.forEach(clearTimeout);
  subTimers = [];
}

function updateUI() {
  steps.forEach((step, i) => {
    step.classList.remove('active', 'done');
    if (i < currentStep) step.classList.add('done');
    if (i === currentStep) step.classList.add('active');
  });

  connectors.forEach((conn, i) => {
    conn.classList.remove('flowing', 'done');
    if (i < currentStep) conn.classList.add('done');
  });

  dots.forEach((dot, i) => {
    dot.classList.remove('active', 'done');
    if (i < currentStep) dot.classList.add('done');
    if (i === currentStep) dot.classList.add('active');
  });

  if (currentStep >= 0 && currentStep < stepData.length) {
    descTitle.textContent = stepData[currentStep].title;
    descText.textContent = stepData[currentStep].text;
    descTitle.classList.remove('show');
    descText.classList.remove('show');
    setTimeout(() => {
      descTitle.classList.add('show');
      descText.classList.add('show');
    }, 50);
    renderCode(currentStep);
    renderVisual(currentStep);
  } else {
    descTitle.classList.remove('show');
    descText.classList.remove('show');
    codeContent.innerHTML = '';
    visualContent.innerHTML = '<div style="color:#4a5568;font-size:13px;">点击播放或步骤开始演示</div>';
  }

  prevBtn.disabled = currentStep <= 0;
  nextBtn.disabled = currentStep >= steps.length - 1;
}

function renderCode(stepIdx) {
  const lines = codeSnippets[stepIdx];
  const hl = highlightLines[stepIdx];
  codeContent.innerHTML = lines.map(l =>
    `<div class="code-line ${hl.includes(l.ln) ? 'active' : ''}">
      <span class="ln">${l.ln}</span>
      <span class="lc">${l.code || '&nbsp;'}</span>
    </div>`
  ).join('');
}

function renderVisual(stepIdx) {
  clearSubTimers();
  if (stepIdx === 0) renderInitVisual();
  else if (stepIdx === 1) renderClickVisual();
  else if (stepIdx === 2) renderFetchVisual();
  else if (stepIdx === 3) renderJsonVisual();
  else if (stepIdx === 4) renderDomVisual();
}

          <span class="line-num">${i + 1}</span>
          <span class="line-code">${l.code}</span>
        </div>
      `).join('')}
    </div>
  `;
  const initLines = visualContent.querySelectorAll('.init-line');
  let idx = 0;
  function highlightNext() {
    if (idx > 0) initLines[idx - 1].classList.remove('highlight');
    if (idx < initLines.length) {
      initLines[idx].classList.add('highlight');
      idx++;
      schedule(highlightNext, 700);
    }
  }
  highlightNext();
}

function goToStep(step) {
  if (step < -1 || step >= steps.length) return;
  const prevStep = currentStep;
  currentStep = step;
  if (step > prevStep && step >= 0 && step < steps.length) {
    const conn = connectors[step - 1];
    if (conn) {
      conn.classList.add('flowing');
      setTimeout(() => conn.classList.remove('flowing'), 700);
    }
  }
  updateUI();
}

function nextStep() {
  if (currentStep < steps.length - 1) goToStep(currentStep + 1);
}

function prevStep() {
  if (currentStep > 0) goToStep(currentStep - 1);
  else if (currentStep === 0) goToStep(-1);
}

function startPlay() {
  isPlaying = true;
  playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  playText.textContent = '暂停';
  if (currentStep >= steps.length - 1) goToStep(-1);
  playTimer = setInterval(() => {
    if (currentStep < steps.length - 1) nextStep();
    else stopPlay();
  }, 3500);
}

function stopPlay() {
  isPlaying = false;
  playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  playText.textContent = '播放';
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
}

function reset() {
  stopPlay();
  clearSubTimers();
  goToStep(-1);
}

playBtn.addEventListener('click', () => { if (isPlaying) stopPlay(); else startPlay(); });
nextBtn.addEventListener('click', () => { stopPlay(); nextStep(); });
prevBtn.addEventListener('click', () => { stopPlay(); prevStep(); });
resetBtn.addEventListener('click', reset);

steps.forEach((step, i) => {
  step.addEventListener('click', () => { stopPlay(); goToStep(i); });
});

dots.forEach((dot, i) => {
  dot.addEventListener('click', () => { stopPlay(); goToStep(i); });
});
