<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Vue 3 AJAX 获取 JSON 数据</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f7fa; }
        .container { max-width: 700px; margin: 0 auto; }

        button {
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #42b883;
            color: white;
            border: none;
            border-radius: 6px;
            transition: 0.3s;
        }
        button:hover { background: #33a06f; }
        button:disabled { background: #a0c0b0; cursor: not-allowed; }

        .user-list {
            margin-top: 20px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-height: 80px;
        }
        .user-item {
            padding: 10px 14px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .user-item:last-child { border-bottom: none; }
        .user-item strong { color: #2c3e50; }
        .user-item span { color: #7f8c8d; font-size: 14px; }

        .loading-text { color: #95a5a6; text-align: center; padding: 20px 0; }
        .error-text { color: #e74c3c; text-align: center; padding: 20px 0; }
        .empty-text { color: #95a5a6; text-align: center; padding: 20px 0; }
    </style>
</head>
<body>
<div id="app" class="container">
    <h2>👤 用户管理系统（Vue 3 版）</h2>
        <!-- ★ 点击按钮触发加载，加载中自动禁用 -->
    <button @click="fetchUsers" :disabled="loading">
        {{ loading ? '⏳ 加载中...' : '📥 异步加载用户数据' }}
    </button>
    <!-- ★ 使用 v-if / v-else-if / v-else 控制显示 -->
    <div class="user-list">
        <!-- 加载中 -->
        <div v-if="loading" class="loading-text">⏳ 正在请求数据...</div>
                <!-- 加载失败 -->
        <div v-else-if="error" class="error-text">❌ {{ error }}</div>
                <!-- 数据为空 -->
        <div v-else-if="isEmpty" class="empty-text">👀 暂无用户数据，点击按钮加载</div>
                <!-- ★ 核心：v-for 循环渲染列表 -->
        <div v-else>
            <div v-for="user in users" :key="user.id" class="user-item">
                <div>
                    <strong>👤 {{ user.name }}</strong>
                    <span style="margin-left:12px;">@{{ user.username }}</span>
                </div>
                <span>📧 {{ user.email }}</span>
            </div>
            <div style="padding:8px 0 0; color:#95a5a6; font-size:13px; border-top:1px solid #eee; margin-top:4px;">
                共 {{ users.length }} 位用户
            </div>
        </div>
    </div>
</div>
<!-- ★ 1. 引入 Vue 3 CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script>
    // ★ 2. 创建 Vue 应用
    const { createApp, ref, computed } = Vue;
    const app = createApp({
        setup() {
            // ★ 3. 定义响应式数据（Model）
            const users = ref([]);        // 用户列表，初始为空数组
            const loading = ref(false);   // 加载状态
            const error = ref(null);      // 错误信息
            // 修复：抽 isEmpty 计算属性，模板可读性更好
            const isEmpty = computed(() => users.value.length === 0);

            let requestId = 0;            // 修复：请求序号，用于竞态处理

            // ★ 4. 定义异步方法（去服务器取 JSON 数据）
            const fetchUsers = async () => {
                const currentId = ++requestId;   // 记录本次请求序号
                // 重置状态
                loading.value = true;
                error.value = null;

                // 修复：AbortController 设置 8 秒超时
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                try {
                    // ★ 使用原生 fetch API（异步取数据）
                    const response = await fetch('https://jsonplaceholder.typicode.com/users', { signal: controller.signal });
                    if (!response.ok) {
                        throw new Error(`网络请求失败，状态码：${response.status}`);
                    }
                    // 解析 JSON
                    const data = await response.json();
                    // 修复：仅当本次仍是最新请求时才写入，避免竞态覆盖
                    if (currentId === requestId) {
                        users.value = data;
                    }
                } catch (err) {
                    if (currentId === requestId) {
                        error.value = err.name === 'AbortError' ? '请求超时，请重试' : err.message;
                        users.value = [];
                    }
                } finally {
                    clearTimeout(timeoutId);
                    if (currentId === requestId) {
                        loading.value = false;
                    }
                }
            };

            // ★ 返回数据和方法，供模板使用
            return {
                users,
                loading,
                error,
                isEmpty,
                fetchUsers
            };
        }
    });

    // 挂载到 #app
    app.mount('#app');
</script>

</body>
</html>
